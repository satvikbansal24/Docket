<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Docket — Time & Billing</title>
<meta name="theme-color" content="#1C2333" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Docket" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1C2333; --paper:#F7F3EC; --paper-raised:#FBF8F3;
    --rule:#DAD3C4; --rule-dark:#C7BEA9; --gold:#9C7A34; --gold-dark:#7A5F27;
    --gold-bg:#F0ECE3; --muted:#7A7466;
    --input-bg:#FFFFFF; --solid-btn-bg:#1C2333; --solid-btn-text:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EDE9DD; --paper:#14171F; --paper-raised:#1D212C;
      --rule:#2E3441; --rule-dark:#3B4250; --gold:#D9B36A; --gold-dark:#C89A4A;
      --gold-bg:#242A38; --muted:#938F82;
      --input-bg:#232838; --solid-btn-bg:#EDE9DD; --solid-btn-text:#181C26;
    }
  }
  :root[data-theme="dark"]{
    --ink:#EDE9DD; --paper:#14171F; --paper-raised:#1D212C;
    --rule:#2E3441; --rule-dark:#3B4250; --gold:#D9B36A; --gold-dark:#C89A4A;
    --gold-bg:#242A38; --muted:#938F82;
    --input-bg:#232838; --solid-btn-bg:#EDE9DD; --solid-btn-text:#181C26;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;}
  input,select,textarea,button{font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  button{cursor:pointer;}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .serif{font-family:'Source Serif 4',serif;}
  #app{max-width:640px;margin:0 auto;padding-bottom:60px;min-height:100vh;}
  .hidden{display:none !important;}

  /* Header */
  header{border-bottom:1px solid var(--rule);padding:calc(24px + env(safe-area-inset-top)) 20px 0;}
  .header-top{display:flex;justify-content:space-between;align-items:center;}
  header .brand{font-family:'Source Serif 4',serif;font-size:24px;font-weight:700;letter-spacing:-0.01em;}
  header .tagline{font-size:12px;color:var(--muted);margin:2px 0 16px;letter-spacing:.03em;text-transform:uppercase;}
  .icon-btn.settings-btn{margin:-10px -8px 0 0;padding:12px;}
  .icon-btn.settings-btn svg{width:20px;height:20px;}
  nav{display:flex;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;background:none;border:none;
    color:var(--muted);border-bottom:2px solid transparent;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.03em;}
  .tab.active{color:var(--ink);border-bottom-color:var(--gold-dark);font-weight:600;}
  .tab svg{width:17px;height:17px;}

  main{padding:20px;}
  .card{background:var(--paper-raised);border:1px solid var(--rule);border-radius:4px;padding:24px;}
  .field{margin-top:10px;}
  .field > label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:4px;margin-bottom:5px;}
  .field > label svg{width:11px;height:11px;flex-shrink:0;}
  .field input, .field select, .field textarea{width:100%;padding:10px 12px;border-radius:3px;border:1px solid var(--rule);font-size:14px;background:var(--input-bg);color:var(--ink);}
  .row{display:flex;gap:8px;}
  .btn-primary{background:var(--gold-dark);color:#fff;border:none;border-radius:3px;padding:9px 0;font-size:13px;font-weight:600;flex:1;
    display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn-primary svg{width:14px;height:14px;}
  .btn-stop{background:var(--solid-btn-bg);color:var(--solid-btn-text);border:none;border-radius:3px;padding:9px 0;font-size:13px;font-weight:600;flex:1;
    display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn-stop svg{width:14px;height:14px;}
  .btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:9px 16px;font-size:13px;}
  .btn-dark{background:var(--solid-btn-bg);color:var(--solid-btn-text);border:none;border-radius:3px;padding:10px 0;font-size:13px;font-weight:600;width:100%;margin-top:4px;}
  .btn-gold{background:var(--gold-dark);color:#fff;border:none;border-radius:3px;padding:8px 14px;font-size:13px;font-weight:600;}
  .timer-display{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:44px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;}
  .timer-display.running{color:var(--ink);}
  .billing-note{text-align:center;font-size:12px;color:var(--muted);margin-top:-4px;margin-bottom:8px;}
  .manual-box{background:var(--gold-bg);padding:10px;border-radius:3px;display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .manual-box .row input:first-child{width:80px;flex:none;}
  .manual-box .row input{padding:8px 10px;border-radius:3px;border:1px solid var(--rule);font-size:13px;background:var(--input-bg);color:var(--ink);}
  .manual-box select{padding:8px 10px;border-radius:3px;border:1px solid var(--rule);font-size:13px;background:var(--input-bg);color:var(--ink);}

  .summary-strip{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding:0 4px;}
  .summary-strip .label{font-size:13px;color:var(--muted);}
  .summary-strip .value{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;}

  .day-group{border-top:1px solid var(--rule);}
  .day-header{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;padding:12px 4px;color:var(--ink);}
  .day-header .label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .day-header .total{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);}
  .entry-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 10px 22px;border-top:1px dashed var(--rule);}
  .entry-row .name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry-row .note{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .entry-row .right{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:10px;}
  .entry-row .amount{font-family:'IBM Plex Mono',monospace;font-size:13.5px;}
  .icon-btn{background:none;border:none;color:var(--muted);padding:4px;display:flex;}
  .icon-btn svg{width:14px;height:14px;}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:36px 0;}
  .empty.bordered{border:1px dashed var(--rule-dark);border-radius:4px;padding:40px 20px;}

  /* Projects */
  .proj-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap;}
  .proj-toolbar label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
  .proj-toolbar-actions{display:flex;gap:8px;}
  .form-box{background:var(--gold-bg);border-radius:4px;padding:16px;margin-bottom:16px;}
  .form-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .form-head .title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;}
  .form-head .title svg{width:14px;height:14px;flex-shrink:0;}
  .form-box textarea{resize:vertical;}
  .ai-box{background:var(--gold-bg);border-radius:4px;padding:16px;margin-bottom:16px;}
  .ai-box textarea{resize:vertical;}
  .ai-note{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.4;}
  .ai-error{font-size:12.5px;color:#B4483A;margin-top:8px;}
  .ai-task-list{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .ai-task-item{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;background:var(--input-bg);border:1px solid var(--rule);border-radius:3px;padding:8px 10px;}
  .ai-task-item input{margin-top:2px;}
  .proj-card{border:1px solid var(--rule);border-radius:4px;margin-bottom:10px;background:var(--paper-raised);}
  .proj-card.inactive{opacity:0.6;}
  .proj-card .body{padding:14px;}
  .proj-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .proj-card .name{font-size:15px;font-weight:600;}
  .proj-card .desc{font-size:13px;color:var(--muted);margin-top:3px;}
  .proj-card .inc{font-size:11.5px;color:var(--gold-dark);margin-top:6px;text-transform:uppercase;letter-spacing:.03em;}
  .proj-card .actions{display:flex;gap:6px;flex-shrink:0;margin-left:8px;}
  .subproj-btn{margin-top:10px;display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--rule);border-radius:3px;padding:5px 10px;font-size:12px;color:var(--gold-dark);}
  .subproj-btn svg{width:12px;height:12px;}
  .sub-list{border-top:1px solid var(--rule);}
  .sub-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px 10px 28px;border-top:1px dashed var(--rule);}
  .sub-row.inactive{opacity:0.6;}
  .sub-row .name{font-size:13.5px;font-weight:500;}
  .sub-row .desc{font-size:12px;color:var(--muted);margin-top:2px;}
  .sub-row .inc{font-size:11px;color:var(--gold-dark);margin-top:4px;text-transform:uppercase;letter-spacing:.03em;}

  /* Report */
  .date-row{display:flex;gap:10px;margin-bottom:16px;}
  .date-row .field{flex:1;margin-top:0;}
  .report-card{background:var(--paper-raised);border:1px solid var(--rule);border-radius:4px;padding:18px 16px;}
  .report-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .report-head .range{font-family:'Source Serif 4',serif;font-size:16px;font-weight:700;}
  .report-head .total{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;}
  .report-sub{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .report-group{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:14px;margin-bottom:4px;border-top:1px solid var(--rule);padding-top:10px;}
  .report-group.first{margin-top:0;border-top:none;padding-top:0;}
  .report-row{display:flex;justify-content:space-between;padding:5px 0 5px 10px;font-size:13.5px;}
  .report-row .rname.muted{color:var(--muted);}
  .report-row .rright{display:flex;gap:12px;}
  .report-row .rcount{color:var(--muted);font-size:12px;}
  .report-row .ramount{font-family:'IBM Plex Mono',monospace;}

  .backup-section{margin-top:24px;padding-top:18px;border-top:1px solid var(--rule);}
  .backup-section .backup-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;}
  .backup-note{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5;}
  .backup-actions{display:flex;gap:8px;}
  .backup-actions .btn-secondary{flex:1;text-align:center;}

  /* Settings */
  #settingsOverlay{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;}
  .settings-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.45);}
  .settings-panel{position:relative;width:100%;max-width:400px;max-height:80vh;overflow-y:auto;
    background:var(--paper-raised);border:1px solid var(--rule);border-radius:6px;padding:20px;}
  .settings-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .settings-title{font-family:'Source Serif 4',serif;font-size:18px;font-weight:700;}
  .settings-section{margin-top:20px;}
  .settings-section:first-of-type{margin-top:0;}
  .settings-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .theme-toggle{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;}
  .theme-opt{flex:1;background:var(--paper);color:var(--muted);border:none;border-right:1px solid var(--rule);padding:9px 0;font-size:13px;font-weight:500;}
  .theme-opt:last-child{border-right:none;}
  .theme-opt.active{background:var(--gold-dark);color:#fff;font-weight:600;}
  .settings-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;}

  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-right:7px;vertical-align:middle;}
  .dot-outline{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-right:7px;vertical-align:middle;background:transparent;border:1.5px solid var(--rule-dark);}
  .proj-card{border-left:3px solid var(--rule);}
  .sub-row{position:relative;}
  .color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:4px;}
  .color-swatch{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}
  .color-swatch.selected{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper-raised), 0 0 0 3px var(--ink);}
  .custom-color-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .custom-color-row input[type=color]{width:36px;height:36px;border:1px solid var(--rule);border-radius:50%;padding:0;background:none;overflow:hidden;}
  .custom-color-row span{font-size:12px;color:var(--muted);}

  .timer-live{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:44px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
  .timer-live.paused{color:var(--muted);}
  .timer-state-label{text-align:center;font-size:11px;color:var(--gold-dark);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;margin-bottom:2px;font-weight:600;}
  .pause-row{display:flex;gap:8px;margin-top:12px;}
  .btn-pause{background:var(--gold-dark);color:#fff;border:none;border-radius:3px;padding:9px 0;font-size:13px;font-weight:600;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn-pause svg{width:14px;height:14px;}
  .btn-resume{background:var(--solid-btn-bg);color:var(--solid-btn-text);border:none;border-radius:3px;padding:9px 0;font-size:13px;font-weight:600;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn-resume svg{width:14px;height:14px;}
  .btn-submit{background:var(--gold-dark);color:#fff;border:none;border-radius:3px;padding:9px 0;font-size:13px;font-weight:600;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;}
  .discard-link{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:6px 4px;display:block;margin:6px auto 0;}

  .export-row{display:flex;gap:8px;margin-top:14px;}
  .btn-export{flex:1;background:var(--gold-dark);color:#fff;border:none;border-radius:3px;padding:11px 0;font-size:13px;font-weight:600;}
  .btn-export.secondary{background:var(--solid-btn-bg);color:var(--solid-btn-text);}
  .btn-export:disabled{background:var(--rule);cursor:not-allowed;}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="header-top">
      <div>
        <div class="brand">Docket</div>
        <div class="tagline">Time &amp; billing ledger</div>
      </div>
      <button class="icon-btn settings-btn" id="settingsBtn" aria-label="Settings"></button>
    </div>
    <nav>
      <button class="tab active" data-tab="timer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Timer
      </button>
      <button class="tab" data-tab="projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
        Projects
      </button>
      <button class="tab" data-tab="report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg>
        Report
      </button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<div id="settingsOverlay" class="hidden">
  <div class="settings-backdrop" id="settingsBackdrop"></div>
  <div class="settings-panel" id="settingsPanel"></div>
</div>

<script>
/* ---------- Storage ---------- */
const LS = {
  get(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } },
  set(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
};

const INCREMENTS = [
  { id:"6min", label:"6 min (0.1 hr)", minutes:6 },
  { id:"15min", label:"15 min (0.25 hr)", minutes:15 },
  { id:"30min", label:"30 min (0.5 hr)", minutes:30 },
];

const COLOR_PALETTE = [
  "#8C5A4A", // rust
  "#5F7A8C", // slate blue
  "#6E7F6C", // sage
  "#8C5F6E", // dusty plum
  "#4A6E7A", // deep teal
  "#7A6E8C", // muted lavender
  "#8C6E54", // umber
  "#5A7A6E", // teal-sage
  "#6E6E8C", // periwinkle
  "#7A5A6E", // mauve
  "#6E7A4A", // olive
  "#8C7A5A", // sand
];

const DEFAULT_PROJECTS = [
  { id:"p1", parentId:null, name:"Hughes Satellite Systems", description:"Chapter 11 — Valuation", status:"active", increment:"6min", color:"#8C5A4A" },
  { id:"p2", parentId:null, name:"Vi-Jon", description:"Bankruptcy advisory", status:"active", increment:"15min", color:"#5F7A8C" },
];

let state = {
  entries: LS.get("dk_entries", []),
  projects: LS.get("dk_projects", DEFAULT_PROJECTS),
  running: LS.get("dk_running", null),
};

// Migration: assign a color to any project that predates the color feature
state.projects.forEach((p, i) => { if(!p.color) p.color = COLOR_PALETTE[i % COLOR_PALETTE.length]; });
// Sub-projects always match their parent's color — normalize any that predate that rule.
state.projects.forEach(p => {
  if(!p.parentId) return;
  const parent = state.projects.find(pp=>pp.id===p.parentId);
  if(parent) p.color = parent.color;
});

function nextAutoColor(){
  const used = state.projects.filter(p=>!p.parentId).map(p=>p.color);
  const free = COLOR_PALETTE.find(c=> !used.includes(c));
  return free || COLOR_PALETTE[state.projects.length % COLOR_PALETTE.length];
}

function hexToRgb(hex){
  const h = hex.replace("#","");
  return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)];
}
function projectColor(id){
  const p = state.projects.find(pr=>pr.id===id);
  if(!p) return "#7A7466";
  if(p.parentId){ const parent = state.projects.find(pp=>pp.id===p.parentId); return (parent && parent.color) || p.color || "#7A7466"; }
  return p.color || "#7A7466";
}

function persist(){
  LS.set("dk_entries", state.entries);
  LS.set("dk_projects", state.projects);
  LS.set("dk_running", state.running);
}

/* ---------- Helpers ---------- */
function pad(n){ return n.toString().padStart(2,"0"); }
function fmtHMS(s){ const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=Math.floor(s%60); return `${pad(h)}:${pad(m)}:${pad(sec)}`; }
function fmtH(s){ return (s/3600).toFixed(2); }
function roundToIncrement(seconds, incMinutes){ const inc=incMinutes*60; if(seconds<=0) return 0; return Math.ceil(seconds/inc)*inc; }
function todayKey(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dayLabel(key){
  const [y,m,d]=key.split("-").map(Number); const date=new Date(y,m-1,d);
  const today=todayKey(), yest=todayKey(new Date(Date.now()-86400000));
  if(key===today) return "Today";
  if(key===yest) return "Yesterday";
  return date.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
}
function projectById(id){ return state.projects.find(p=>p.id===id) || {name:"Unknown", increment:"15min"}; }
function projectPath(id){
  const p = projectById(id);
  if(p.parentId){ const parent = projectById(p.parentId); return `${parent.name} / ${p.name}`; }
  return p.name;
}
function incrementMinutes(projectId){
  const p = projectById(projectId);
  const inc = INCREMENTS.find(i=>i.id===p.increment) || INCREMENTS[1];
  return inc.minutes;
}
function incLabel(id){ return (INCREMENTS.find(i=>i.id===id)||{}).label || id; }

/* ---------- Theme ---------- */
const THEME_KEY = "dk_theme";
function getTheme(){ return LS.get(THEME_KEY, "system"); }
function applyTheme(theme){
  const root = document.documentElement;
  if(theme === "light" || theme === "dark") root.setAttribute("data-theme", theme);
  else root.removeAttribute("data-theme");
  const meta = document.querySelector('meta[name="theme-color"]');
  const paper = getComputedStyle(root).getPropertyValue("--paper").trim();
  if(meta && paper) meta.setAttribute("content", paper);
}
function setTheme(theme){
  LS.set(THEME_KEY, theme);
  applyTheme(theme);
}
applyTheme(getTheme());

/* ---------- Timer View ---------- */
let timerNote = "";
let showManual = false;
let manualProject = null;
let collapsedDays = {};

function activeProjects(){ return state.projects.filter(p=>p.status==="active"); }

function renderTimer(main){
  const actives = activeProjects();

    main.innerHTML = `<div class="empty bordered">No active projects yet. Add one in the Projects tab to start logging time.</div>`;

  }

  const running = state.running;
  const isTicking = running && running.startedAt;
  const liveElapsed = running ? liveElapsedSeconds() : 0;

  main.innerHTML = `
    <div class="card">
      <div class="timer-live ${isTicking?'':'paused'}" id="timerDisplay">${fmtHMS(liveElapsed)}</div>
      ${running ? `<div class="timer-state-label">${isTicking ? 'Running' : 'Paused'}</div>` : ""}
      ${running ? `<div class="billing-note" id="billingNote">would bill ${fmtH(roundToIncrement(liveElapsed, incrementMinutes(running.projectId)))}h at submit (${incrementMinutes(running.projectId)}-min increments)</div>` : ""}
      <div class="field">
        <label>Project</label>
        <select id="projectSelect" ${running?'disabled':''}>
          ${actives.map(p=>`<option value="${p.id}" ${p.id===selectedProject?'selected':''}>${esc(projectPath(p.id))}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Note (optional)</label>
        <input id="noteInput" type="text" placeholder="What are you working on?" value="${esc(running ? running.note : timerNote)}" />
      </div>
      ${!running ? `
        <div class="row" style="margin-top:12px;">
          <button class="btn-primary" id="startBtn">${svg('play')} Start</button>
          <button class="btn-secondary" id="manualToggle">Log manually</button>
        </div>
      ` : `
        <div class="pause-row">
          ${isTicking
            ? `<button class="btn-pause" id="pauseBtn">${svg('stop')} Pause</button>`
            : `<button class="btn-resume" id="resumeBtn">${svg('play')} Resume</button>`
          }
          <button class="btn-submit" id="submitBtn">Submit &amp; log</button>
        </div>
        <button class="discard-link" id="discardBtn">Discard this timer</button>
      `}
      <div id="manualBox" class="manual-box ${showManual && !running?'':'hidden'}">
        <select id="manualProjectSelect">
          ${actives.map(p=>`<option value="${p.id}" ${p.id===manualProject?'selected':''}>${esc(projectPath(p.id))}</option>`).join("")}
        </select>
        <div class="row">
          <input id="manualHours" type="number" step="0.1" min="0" placeholder="Hours" />
          <input id="manualNote" type="text" placeholder="Note (optional)" style="flex:1;" />
          <button class="btn-gold" id="manualLogBtn">Log</button>
        </div>
      </div>
    </div>

    <div class="summary-strip">
      <div class="label">Billed today</div>
      <div class="value" id="todayTotal">${fmtH(todayTotalSeconds())}h</div>
    </div>

    <div id="ledger">${renderLedgerHTML()}</div>
  `;

  document.getElementById("projectSelect").addEventListener("change", e=>{ selectedTimerProject = e.target.value; });
  document.getElementById("noteInput").addEventListener("input", e=>{
    if(state.running){ state.running.note = e.target.value; persist(); }
    else timerNote = e.target.value;
  });
  if(running){
    if(isTicking) document.getElementById("pauseBtn").addEventListener("click", pauseTimer);
    else document.getElementById("resumeBtn").addEventListener("click", resumeTimer);
    document.getElementById("submitBtn").addEventListener("click", submitTimer);
    document.getElementById("discardBtn").addEventListener("click", discardTimer);
  } else {
    document.getElementById("startBtn").addEventListener("click", startTimer);
  }
  document.getElementById("manualToggle") && document.getElementById("manualToggle").addEventListener("click", ()=>{ showManual = !showManual; renderTimer(main); });
  if(showManual && !running){
    document.getElementById("manualProjectSelect").addEventListener("change", e=>{ manualProject = e.target.value; });
    document.getElementById("manualLogBtn").addEventListener("click", addManualEntry);
  }

  attachLedgerHandlers();
  startTicking();
}

let selectedTimerProject = null;

function liveElapsedSeconds(){
  if(!state.running) return 0;
  const base = state.running.accumulatedSeconds || 0;
  if(state.running.startedAt){
    return base + Math.floor((Date.now()-new Date(state.running.startedAt).getTime())/1000);
  }
  return base;
}

function renderTimerTick(){
  if(currentTab !== "timer" || !state.running || !state.running.startedAt) return;
  const elapsed = liveElapsedSeconds();
  const disp = document.getElementById("timerDisplay");
  if(disp) disp.textContent = fmtHMS(elapsed);
  const note = document.getElementById("billingNote");
  if(note) note.textContent = `would bill ${fmtH(roundToIncrement(elapsed, incrementMinutes(state.running.projectId)))}h at submit (${incrementMinutes(state.running.projectId)}-min increments)`;
  const todayEl = document.getElementById("todayTotal");
  if(todayEl) todayEl.textContent = `${fmtH(todayTotalSeconds())}h`;
}

function todayTotalSeconds(){
  const today = todayKey();
  return state.entries.filter(e=>e.date===today).reduce((s,e)=>s+e.billedSeconds,0);
}

function startTimer(){
  if(!selectedTimerProject) return;
  const now = new Date().toISOString();
  state.running = { projectId: selectedTimerProject, note: timerNote, startedAt: now, accumulatedSeconds: 0, firstStartedAt: now };
  persist();
  renderTimer(document.getElementById("main"));
}
function pauseTimer(){
  if(!state.running || !state.running.startedAt) return;
  const elapsed = liveElapsedSeconds();
  state.running.accumulatedSeconds = elapsed;
  state.running.startedAt = null;
  persist();
  renderTimer(document.getElementById("main"));
}
function resumeTimer(){
  if(!state.running || state.running.startedAt) return;
  state.running.startedAt = new Date().toISOString();
  persist();
  renderTimer(document.getElementById("main"));
}
function submitTimer(){
  if(!state.running) return;
  const rawSeconds = Math.max(1, liveElapsedSeconds());
  const inc = incrementMinutes(state.running.projectId);
  const billedSeconds = roundToIncrement(rawSeconds, inc);
  const startedAtForDate = state.running.firstStartedAt || state.running.startedAt || new Date().toISOString();
  state.entries.unshift({
    id: "e_"+Date.now(), projectId: state.running.projectId, note: state.running.note,
    rawSeconds, billedSeconds, date: todayKey(), startedAt: startedAtForDate, endedAt: new Date().toISOString(),
  });
  state.running = null;
  timerNote = "";
  persist();
  renderTimer(document.getElementById("main"));
}
function discardTimer(){
  if(!state.running) return;
  if(!confirm("Discard this running timer without logging any time?")) return;
  state.running = null;
  timerNote = "";
  persist();
  renderTimer(document.getElementById("main"));
}
function addManualEntry(){
  const hrsInput = document.getElementById("manualHours");
  const noteInput = document.getElementById("manualNote");
  const hrs = parseFloat(hrsInput.value);
  if(!hrs || hrs<=0 || !manualProject) return;
  const rawSeconds = Math.round(hrs*3600);
  const inc = incrementMinutes(manualProject);
  const billedSeconds = roundToIncrement(rawSeconds, inc);
  state.entries.unshift({
    id:"e_"+Date.now(), projectId: manualProject, note: noteInput.value,
    rawSeconds, billedSeconds, date: todayKey(), startedAt: new Date().toISOString(), endedAt: new Date().toISOString(), manual:true,
  });
  showManual = false;
  persist();
  renderTimer(document.getElementById("main"));
}

function renderLedgerHTML(){
  const grouped = {};
  state.entries.forEach(e=>{ (grouped[e.date] = grouped[e.date]||[]).push(e); });
  const dayKeys = Object.keys(grouped).sort((a,b)=> a<b?1:-1);
  if(dayKeys.length===0) return `<div class="empty" style="border-top:1px solid var(--rule);">No entries yet.</div>`;
  return dayKeys.map(day=>{
    const dayEntries = grouped[day].slice().sort((a,b)=> new Date(b.startedAt)-new Date(a.startedAt));
    const daySeconds = dayEntries.reduce((s,e)=>s+e.billedSeconds,0);
    const collapsed = !!collapsedDays[day];
    return `
      <div class="day-group">
        <button class="day-header" data-day="${day}">
          <span class="label">${collapsed?svg('chevronRight'):svg('chevronDown')} ${dayLabel(day)}</span>
          <span class="total">${fmtH(daySeconds)}h</span>
        </button>
        ${collapsed ? "" : dayEntries.map(e=>`
          <div class="entry-row">
            <div style="min-width:0;">
              <div class="name"><span class="dot" style="background:${projectColor(e.projectId)}"></span>${esc(projectPath(e.projectId))}</div>
              ${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}
            </div>
            <div class="right">
              <span class="amount">${fmtH(e.billedSeconds)}h</span>
              <button class="icon-btn" data-resume="${e.id}" aria-label="Resume this entry" title="Resume">${svg('play')}</button>
              <button class="icon-btn" data-delete="${e.id}" aria-label="Delete entry">${svg('trash')}</button>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }).join("");
}

function attachLedgerHandlers(){
  document.querySelectorAll(".day-header").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const day = btn.dataset.day;
      collapsedDays[day] = !collapsedDays[day];
      document.getElementById("ledger").innerHTML = renderLedgerHTML();
      attachLedgerHandlers();
    });
  });
  document.querySelectorAll("[data-delete]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.entries = state.entries.filter(e=>e.id!==btn.dataset.delete);
      persist();
      document.getElementById("ledger").innerHTML = renderLedgerHTML();
      attachLedgerHandlers();
      const todayEl = document.getElementById("todayTotal");
      if(todayEl) todayEl.textContent = `${fmtH(todayTotalSeconds())}h`;
    });
  });
  document.querySelectorAll("[data-resume]").forEach(btn=>{
    btn.addEventListener("click", ()=> resumeEntry(btn.dataset.resume));
  });
}

function resumeEntry(entryId){
  if(state.running){
    if(!confirm("A timer is already running. Discard it and resume this entry instead?")) return;
  }
  const entry = state.entries.find(e=>e.id===entryId);
  if(!entry) return;
  if(!confirm(`Resume this entry? It'll go back to tracking live time from ${fmtH(entry.rawSeconds)}h raw (unrounded) — you'll need to submit again to log it.`)) return;

  state.entries = state.entries.filter(e=>e.id!==entryId);
  state.running = {
    projectId: entry.projectId,
    note: entry.note || "",
    startedAt: new Date().toISOString(),
    accumulatedSeconds: entry.rawSeconds,
    firstStartedAt: entry.startedAt,
  };
  timerNote = entry.note || "";
  persist();

  currentTab = "timer";
  document.querySelectorAll(".tab").forEach(b=> b.classList.toggle("active", b.dataset.tab==="timer"));
  render();
}

async function submitAiPrompt(){
  const prompt = aiPromptText.trim();
  if(!prompt || aiLoading) return;
  aiLoading = true;
  aiError = "";
  renderProjects(document.getElementById("main"));
  try{
    const res = await fetch("/.netlify/functions/ask-ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt }),
    });
    const data = await res.json().catch(()=> ({}));
    if(!res.ok) throw new Error(data.error || "Something went wrong — try again.");

    pendingAiTasks = Array.isArray(data.tasks) ? data.tasks.slice(0,6).map(t=>String(t)) : [];
    aiSelectedTasks = new Set(pendingAiTasks.map((_,i)=>i));

    formState = {
      name: typeof data.name === "string" ? data.name.slice(0,120) : "",
      description: typeof data.description === "string" ? data.description.slice(0,300) : "",
      increment: ["6min","15min","30min"].includes(data.increment) ? data.increment : "15min",
      parentId: "",
      color: nextAutoColor(),
    };
    editingId = null;
    showForm = true;
    showAiPrompt = false;
    aiPromptText = "";
  } catch(err){
    aiError = err.message || "Something went wrong — try again.";
  } finally {
    aiLoading = false;
    renderProjects(document.getElementById("main"));
  }
}

  showAiPrompt = true;
  showForm = false;
  aiError = "";
  renderProjects(document.getElementById("main"));
}

        <label>Color</label>
        <div class="color-grid" id="colorGrid">
          ${COLOR_PALETTE.map(c=>`<button type="button" class="color-swatch ${c===formState.color?'selected':''}" data-color="${c}" style="background:${c}" aria-label="Choose color"></button>`).join("")}
        </div>
        <div class="custom-color-row">
          <input type="color" id="customColor" value="${formState.color}" />
          <span>Or pick a custom shade</span>
        </div>
      </div>
      ` : `
      <div class="field">
        <label>Color</label>
        <div class="custom-color-row">
          <span class="dot-outline" style="border-color:${formState.color}"></span>
          <span>Matches its parent project's color</span>
        </div>
      </div>
      `}
      ${pendingAiTasks && pendingAiTasks.length>0 && !editingId && !formState.parentId ? `
      <div class="field">
        <label>${svg('sparkle')} Suggested tasks — become sub-projects</label>
        <div class="ai-task-list">
          ${pendingAiTasks.map((t,i)=>`
            <label class="ai-task-item">
              <input type="checkbox" data-ai-task="${i}" ${aiSelectedTasks.has(i)?'checked':''}/>
              <span>${esc(t)}</span>
            </label>
          `).join("")}
        </div>
      </div>
      ` : ""}
      <button class="btn-dark" id="saveFormBtn">${editingId ? "Save changes" : "Create project"}</button>
    </div>
  `;
}

function attachFormHandlers(){
  document.getElementById("closeFormBtn").addEventListener("click", ()=>{ showForm=false; pendingAiTasks=null; aiSelectedTasks=new Set(); renderProjects(document.getElementById("main")); });
  document.getElementById("formName").addEventListener("input", e=> formState.name = e.target.value);
  document.getElementById("formDesc").addEventListener("input", e=> formState.description = e.target.value);
  document.getElementById("formIncrement").addEventListener("change", e=> formState.increment = e.target.value);
  document.getElementById("saveFormBtn").addEventListener("click", saveProjectForm);
  document.querySelectorAll("#colorGrid [data-color]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      formState.color = btn.dataset.color;
      document.getElementById("customColor").value = btn.dataset.color;
      document.querySelectorAll("#colorGrid [data-color]").forEach(b=> b.classList.toggle("selected", b===btn));
    });
  });
  const customColorInput = document.getElementById("customColor");
  if(customColorInput) customColorInput.addEventListener("input", e=>{
    formState.color = e.target.value;
    document.querySelectorAll("#colorGrid [data-color]").forEach(b=> b.classList.toggle("selected", b.dataset.color.toLowerCase()===e.target.value.toLowerCase()));
  });
  document.querySelectorAll("[data-ai-task]").forEach(cb=>{
    cb.addEventListener("change", e=>{
      const i = Number(cb.dataset.aiTask);
      if(e.target.checked) aiSelectedTasks.add(i); else aiSelectedTasks.delete(i);
    });
  });
}

function openNewForm(parentId){
  const parent = parentId ? state.projects.find(p=>p.id===parentId) : null;
  formState = { name:"", description:"", increment:"15min", parentId: parentId||"", color: parent ? parent.color : nextAutoColor() };
  editingId = null; showForm = true;
  pendingAiTasks = null; aiSelectedTasks = new Set();
  renderProjects(document.getElementById("main"));
}
function openEditForm(id){
  const p = state.projects.find(p=>p.id===id);
  formState = { name:p.name, description:p.description||"", increment:p.increment, parentId:p.parentId||"", color:p.color };
  editingId = id; showForm = true;
  pendingAiTasks = null; aiSelectedTasks = new Set();
  renderProjects(document.getElementById("main"));
}
function saveProjectForm(){
  if(!formState.name.trim()) return;
  // Sub-projects always take their color from their parent — the color picker is hidden for them.
  const parent = formState.parentId ? state.projects.find(p=>p.id===formState.parentId) : null;
  const color = parent ? parent.color : formState.color;
  if(editingId){
    state.projects = state.projects.map(p=> p.id===editingId ? {...p, name:formState.name.trim(), description:formState.description.trim(), increment:formState.increment, color} : p);
    if(!parent){
      // Editing a top-level project's color also updates its existing sub-projects.
      state.projects = state.projects.map(p=> p.parentId===editingId ? {...p, color} : p);
    }
  } else {
    const newId = "p_"+Date.now();
    state.projects.push({ id:newId, parentId: formState.parentId||null, name:formState.name.trim(), description:formState.description.trim(), status:"active", increment:formState.increment, color });
    if(!parent && pendingAiTasks && pendingAiTasks.length){
      pendingAiTasks.forEach((task, i)=>{
        if(!aiSelectedTasks.has(i)) return;
        const taskName = String(task).trim().slice(0,120);
        if(!taskName) return;
        state.projects.push({ id: newId+"_t"+i, parentId:newId, name:taskName, description:"", status:"active", increment:formState.increment, color });
      });
    }
  }
  showForm = false;
  pendingAiTasks = null; aiSelectedTasks = new Set();
  persist();
  renderProjects(document.getElementById("main"));
}
function toggleStatus(id){
  state.projects = state.projects.map(p=> p.id===id ? {...p, status: p.status==="active"?"inactive":"active"} : p);
  persist();
  renderProjects(document.getElementById("main"));
}
function removeProject(id){
  const hasEntries = state.entries.some(e=>e.projectId===id);
  const hasChildren = state.projects.some(p=>p.parentId===id);
  if(hasEntries || hasChildren){ toggleStatus(id); return; }
  state.projects = state.projects.filter(p=>p.id!==id);
  persist();
  renderProjects(document.getElementById("main"));
}

/* ---------- Report View ---------- */
let reportFrom = todayKey(new Date(Date.now()-7*86400000));
let reportTo = todayKey();

function renderReport(main){
  const filtered = state.entries.filter(e=> e.date>=reportFrom && e.date<=reportTo);
  const byProject = {};
  filtered.forEach(e=>{
    byProject[e.projectId] = byProject[e.projectId] || {raw:0, billed:0, count:0};
    byProject[e.projectId].raw += e.rawSeconds||0;
    byProject[e.projectId].billed += e.billedSeconds||0;
    byProject[e.projectId].count += 1;
  });
  const totalBilled = Object.values(byProject).reduce((s,v)=>s+v.billed,0);

  const topLevelIds = state.projects.filter(p=>!p.parentId).map(p=>p.id);
  let rowsHTML = "";
  let first = true;
  topLevelIds.forEach(tid=>{
    const top = state.projects.find(p=>p.id===tid);
    const subIds = state.projects.filter(p=>p.parentId===tid).map(p=>p.id);
    const relevantIds = [tid, ...subIds].filter(id=> byProject[id]);
    if(relevantIds.length===0) return;
    rowsHTML += `<div class="report-group ${first?'first':''}">${esc(top.name)}</div>`;
    first = false;
    relevantIds.forEach(id=>{
      const p = state.projects.find(pp=>pp.id===id);
      const v = byProject[id];
      const name = id===tid ? "(direct)" : p.name;
      rowsHTML += `
        <div class="report-row">
          <span class="rname ${name==='(direct)'?'muted':''}"><span class="dot" style="background:${projectColor(id)}"></span>${esc(name)}</span>
          <span class="rright">
            <span class="rcount">${v.count} ${v.count===1?'entry':'entries'}</span>
            <span class="ramount">${fmtH(v.billed)}h</span>
          </span>
        </div>
      `;
    });
  });

  main.innerHTML = `
    <div class="date-row">
      <div class="field"><label>From</label><input type="date" id="fromInput" value="${reportFrom}" /></div>
      <div class="field"><label>To</label><input type="date" id="toInput" value="${reportTo}" /></div>
    </div>
    <div class="report-card">
      <div class="report-head">
        <div class="range">${reportFrom} — ${reportTo}</div>
        <div class="total">${fmtH(totalBilled)}h</div>
      </div>
      <div class="report-sub">${filtered.length} entries · billed hours reflect each project's rounding rule</div>
      ${rowsHTML || `<div class="empty" style="padding:20px 0;">No entries in this range.</div>`}
    </div>
    <div class="export-row">
      <button class="btn-export" id="exportCsvBtn" ${filtered.length===0?'disabled':''}>Export CSV</button>
      <button class="btn-export secondary" id="exportPdfBtn" ${filtered.length===0?'disabled':''}>Export PDF</button>
    </div>

    <div class="backup-section">
      <div class="backup-title">Backup &amp; restore</div>
      <div class="backup-note">Data lives only in this browser's storage — clearing your browser data, reinstalling, or switching devices will erase it. Download a backup periodically to keep a safe copy.</div>
      <div class="backup-actions">
        <button class="btn-secondary" id="backupBtn">Download backup</button>
        <button class="btn-secondary" id="restoreBtn">Restore from backup</button>
      </div>
      <input type="file" id="restoreFile" accept="application/json" class="hidden" />
    </div>
  `;

  document.getElementById("fromInput").addEventListener("change", e=>{ reportFrom = e.target.value; renderReport(main); });
  document.getElementById("toInput").addEventListener("change", e=>{ reportTo = e.target.value; renderReport(main); });
  document.getElementById("exportCsvBtn").addEventListener("click", ()=> exportCsv(byProject, totalBilled));
  document.getElementById("exportPdfBtn").addEventListener("click", ()=> exportPdf(byProject, totalBilled, filtered));
  document.getElementById("backupBtn").addEventListener("click", downloadBackup);
  document.getElementById("restoreBtn").addEventListener("click", ()=> document.getElementById("restoreFile").click());
  document.getElementById("restoreFile").addEventListener("change", handleRestoreFile);
}

function downloadBackup(){
  const payload = { entries: state.entries, projects: state.projects, running: state.running };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = new Date().toISOString().replace(/[:.]/g,"-");
  a.href = url; a.download = `docket-backup_${ts}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleRestoreFile(e){
  const input = e.target;
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(err){ alert("That file isn't valid JSON."); input.value = ""; return; }
    if(!data || !Array.isArray(data.entries) || !Array.isArray(data.projects)){
      alert("That file doesn't look like a Docket backup (missing entries/projects arrays).");
      input.value = "";
      return;
    }
    const ok = confirm(`Restore ${data.entries.length} entries and ${data.projects.length} projects? This replaces everything currently in the app.`);
    input.value = "";
    if(!ok) return;
    state.entries = data.entries;
    state.projects = data.projects;
    state.running = data.running || null;
    persist();
    renderReport(document.getElementById("main"));
  };
  reader.readAsText(file);
}

function exportCsv(byProject, totalBilled){
  let csv = "Project,Entries,Raw Hours,Billed Hours\n";
  Object.entries(byProject).forEach(([pid,v])=>{
    csv += `"${projectPath(pid)}",${v.count},${fmtH(v.raw)},${fmtH(v.billed)}\n`;
  });
  csv += `\nTotal,,,${fmtH(totalBilled)}\n`;
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `time-report_${reportFrom}_to_${reportTo}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportPdf(byProject, totalBilled, filteredEntries){
  if(!window.jspdf){ alert("PDF library still loading — try again in a moment (requires an internet connection the first time)."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const INK_RGB = hexToRgb("#1C2333");
  const PAPER_RGB = hexToRgb("#F7F3EC");
  const GOLD_RGB = hexToRgb("#9C7A34");
  const MUTED_RGB = hexToRgb("#7A7466");
  const RULE_RGB = hexToRgb("#DAD3C4");
  const PW = 210, PH = 297, M = 15;
  let page = 1;

  function drawHeader(subtitle){
    doc.setFillColor(...INK_RGB);
    doc.rect(0, 0, PW, 34, "F");
    doc.setTextColor(...PAPER_RGB);
    doc.setFont("times", "bold");
    doc.setFontSize(24);
    doc.text("Docket", M, 18);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);
    doc.setTextColor(200, 194, 178);
    doc.text(subtitle.toUpperCase(), M, 25);
    doc.setDrawColor(...GOLD_RGB);
    doc.setLineWidth(0.6);
    doc.line(M, 29, PW-M, 29);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.setTextColor(...PAPER_RGB);
    doc.text(`${reportFrom}  —  ${reportTo}`, PW-M, 16, { align:"right" });
    doc.setFontSize(7.5);
    doc.setTextColor(180, 174, 158);
    doc.text(`Generated ${new Date().toLocaleDateString()}`, PW-M, 21, { align:"right" });
  }

  function drawFooter(){
    doc.setFontSize(7.5);
    doc.setTextColor(...MUTED_RGB);
    doc.setFont("helvetica", "normal");
    doc.text("Docket — Time & Billing Ledger", M, PH-10);
    doc.text(`Page ${page}`, PW-M, PH-10, { align:"right" });
    doc.setDrawColor(...RULE_RGB);
    doc.setLineWidth(0.2);
    doc.line(M, PH-13, PW-M, PH-13);
  }

  function newPage(subtitle){
    doc.addPage();
    page += 1;
    drawHeader(subtitle);
    drawFooter();
    return 44;
  }

  drawHeader("Time & Billing Report");
  drawFooter();
  let y = 44;

  // --- Summary section ---
  doc.setFont("times", "bold");
  doc.setFontSize(15);
  doc.setTextColor(...INK_RGB);
  doc.text("Summary", M, y);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(19);
  doc.text(`${fmtH(totalBilled)}h`, PW-M, y, { align:"right" });
  y += 3;
  doc.setDrawColor(...INK_RGB);
  doc.setLineWidth(0.5);
  doc.line(M, y, PW-M, y);
  y += 9;

  const topLevelIds = state.projects.filter(p=>!p.parentId).map(p=>p.id);
  const barWidth = PW - 2*M - 30;

  topLevelIds.forEach(tid=>{
    const top = state.projects.find(p=>p.id===tid);
    const subIds = state.projects.filter(p=>p.parentId===tid).map(p=>p.id);
    const relevantIds = [tid, ...subIds].filter(id=> byProject[id]);
    if(relevantIds.length===0) return;
    const groupTotal = relevantIds.reduce((s,id)=> s + byProject[id].billed, 0);
    const share = totalBilled ? groupTotal/totalBilled : 0;

    if(y > PH - 45){ y = newPage("Time & Billing Report — Summary (cont.)"); }

    const rgb = hexToRgb(top.color || "#7A7466");
    doc.setFillColor(...rgb);
    doc.circle(M+1.5, y-1.3, 1.5, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.setTextColor(...INK_RGB);
    doc.text(top.name, M+6, y);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10.5);
    doc.text(`${fmtH(groupTotal)}h`, PW-M, y, { align:"right" });
    y += 3;
    doc.setFillColor(...RULE_RGB);
    doc.roundedRect(M+6, y, barWidth, 2.2, 1.1, 1.1, "F");
    doc.setFillColor(...rgb);
    doc.roundedRect(M+6, y, Math.max(2.2, barWidth*share), 2.2, 1.1, 1.1, "F");
    y += 9;
  });

  // --- Log by day section ---
  y += 4;
  if(y > PH - 50){ y = newPage("Time & Billing Report — Log by Day"); }
  doc.setFont("times", "bold");
  doc.setFontSize(15);
  doc.setTextColor(...INK_RGB);
  doc.text("Log by Day", M, y);
  y += 3;
  doc.setDrawColor(...INK_RGB);
  doc.line(M, y, PW-M, y);
  y += 10;

  const grouped = {};
  filteredEntries.forEach(e=>{ (grouped[e.date] = grouped[e.date]||[]).push(e); });
  const dayKeys = Object.keys(grouped).sort();

  dayKeys.forEach(day=>{
    const dayEntries = grouped[day].slice().sort((a,b)=> new Date(a.startedAt)-new Date(b.startedAt));
    const dayTotal = dayEntries.reduce((s,e)=>s+e.billedSeconds,0);

    if(y > PH - 40){ y = newPage("Time & Billing Report — Log by Day (cont.)"); }

    doc.setFillColor(240, 236, 227);
    doc.rect(M, y-4.5, PW-2*M, 7.5, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.setTextColor(...INK_RGB);
    doc.text(dayLabel(day) + "  ·  " + day, M+3, y);
    doc.text(`${fmtH(dayTotal)}h`, PW-M-3, y, { align:"right" });
    y += 9;

    dayEntries.forEach(e=>{
      if(y > PH - 30){ y = newPage("Time & Billing Report — Log by Day (cont.)"); }
      const rgb = hexToRgb(projectColor(e.projectId));
      doc.setFillColor(...rgb);
      doc.circle(M+2, y-1.3, 1.3, "F");
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9.5);
      doc.setTextColor(...INK_RGB);
      doc.text(projectPath(e.projectId), M+6, y);
      doc.setFont("helvetica", "bold");
      doc.text(`${fmtH(e.billedSeconds)}h`, PW-M, y, { align:"right" });
      y += 4.6;
      if(e.note){
        doc.setFont("helvetica", "italic");
        doc.setFontSize(8.5);
        doc.setTextColor(...MUTED_RGB);
        const noteLines = doc.splitTextToSize(e.note, PW-2*M-10);
        doc.text(noteLines, M+6, y);
        y += 4.2*noteLines.length;
      }
      y += 2.5;
    });
    y += 3;
  });

  doc.save(`docket-report_${reportFrom}_to_${reportTo}.pdf`);
}

/* ---------- Settings ---------- */
function openSettings(){
  document.getElementById("settingsOverlay").classList.remove("hidden");
  renderSettingsPanel();
}
function closeSettings(){
  document.getElementById("settingsOverlay").classList.add("hidden");
}
function renderSettingsPanel(){
  const panel = document.getElementById("settingsPanel");
  const theme = getTheme();
  panel.innerHTML = `
    <div class="settings-head">
      <div class="settings-title">Settings</div>
      <button class="icon-btn" id="settingsCloseBtn" aria-label="Close">${svg('x')}</button>
    </div>
    <div class="settings-section">
      <div class="settings-label">Appearance</div>
      <div class="theme-toggle">
        <button class="theme-opt ${theme==='light'?'active':''}" data-theme-opt="light">Light</button>
        <button class="theme-opt ${theme==='dark'?'active':''}" data-theme-opt="dark">Dark</button>
        <button class="theme-opt ${theme==='system'?'active':''}" data-theme-opt="system">System</button>
      </div>
    </div>
  `;
  document.getElementById("settingsCloseBtn").addEventListener("click", closeSettings);
  panel.querySelectorAll("[data-theme-opt]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ setTheme(btn.dataset.themeOpt); renderSettingsPanel(); });
  });
}

/* ---------- Init ---------- */
render();
document.getElementById("settingsBtn").innerHTML = svg('gear');
document.getElementById("settingsBtn").addEventListener("click", openSettings);
document.getElementById("settingsBackdrop").addEventListener("click", closeSettings);

/* Register service worker */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
</script>
